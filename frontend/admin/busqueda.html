<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsqueda de Cursos</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <h2>🎓 Cursos Admin</h2>
            <span>SISTEMA SQL</span>
        </div>

        <nav class="menu">
            <a href="index.html">Dashboard</a>
            <a href="categorias.html">Categorías</a>
            <a href="cursos.html">Alta de Curso</a>
            <a href="busqueda.html" class="active">Búsqueda</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <header class="header">
            <h1>Búsqueda de Cursos</h1>
        </header>

        <section class="card">

            <h3>Filtros</h3>

            <form id="formBusqueda" class="filter-grid">

                <div class="form-group">
                    <label>Curso</label>
                    <input id="q" type="text" placeholder="Nombre del curso">
                </div>

                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria"></select>
                </div>

                <div class="form-group">
                    <label>Nivel</label>
                    <select id="nivel"></select>
                </div>

                <div class="form-group">
                    <label>Instructor</label>
                    <select id="instructor"></select>
                </div>

                <div class="form-group">
                    <label>Estatus</label>
                    <select id="estatus">
                        <option value="">Todos</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Precio mínimo</label>
                    <input id="min" type="number">
                </div>

                <div class="form-group">
                    <label>Precio máximo</label>
                    <input id="max" type="number">
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                    <button class="btn btn-secondary" type="reset">Limpiar</button>
                </div>

            </form>

        </section>

        <!-- RESULTADOS -->
        <section class="card">
            <h3>Resultados</h3>
            <div id="resultados" class="grid-cards"></div>
        </section>

    </main>

</div>

<script src="../js/busqueda.js"></script>
</body>
</html>
