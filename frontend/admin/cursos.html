<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Curso</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <h2>🎓 Cursos Admin</h2>
            <span>SISTEMA SQL</span>
        </div>
    
        <nav class="menu">
            <a href="index.html" class="active">Dashboard</a>
            <a href="registro.html">Registrar Usuario</a>
            <a href="usuarios.html">Gestión de Usuarios</a>
            <a href="cursos.html">Alta de Curso</a>
            <a href="categorias.html">Categorías</a>
            <a href="busqueda.html">Búsqueda</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <header class="header">
            <h1>Alta de Curso</h1>
        </header>

        <section class="card">

            <form id="formCurso">

                <div class="form-grid">

                    <!-- IZQUIERDA -->
                    <div>

                        <div class="form-group">
                            <label>CATEGORÍA *</label>
                            <select id="categoria" required></select>
                        </div>

                        <div class="form-group">
                            <label>NOMBRE *</label>
                            <input id="nombre" type="text" required>
                        </div>

                        <div class="form-group">
                            <label>DESCRIPCIÓN *</label>
                            <textarea id="descripcion" required></textarea>
                        </div>

                    </div>

                    <!-- DERECHA -->
                    <div>

                        <div class="form-group">
                            <label>NIVEL *</label>
                            <select id="nivel" required>
                                <option value="Básico">Básico</option>
                                <option value="Intermedio">Intermedio</option>
                                <option value="Avanzado">Avanzado</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>INSTRUCTOR *</label>
                            <input id="instructor" type="text" list="listaInstructores" required>
                            <datalist id="listaInstructores"></datalist>
                        </div>

                        <div class="form-group">
                            <label>PRECIO *</label>
                            <input id="precio" type="number" step="0.01" min="0.01" required>
                        </div>

                        <div class="form-group">
                            <label>DURACIÓN (MIN) *</label>
                            <input id="duracion" type="number" min="1" required>
                        </div>

                        <div class="form-group">
                            <label>FECHA PUBLICACIÓN</label>
                            <input id="fecha" type="date" required>
                        </div>

                    </div>

                </div>

                <div class="form-footer">
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                    <button type="submit" class="btn btn-primary">Guardar Curso</button>
                </div>

            </form>

        </section>


    </main>

</div>

<script src="../js/cursos.js"></script>
</body>
</html>
